appId: com.engineereddev.casebook
productName: Casebook
copyright: Copyright © EngineeredDev

directories:
  output: dist
  # Where icon.icns lives. Build resources are inputs to the packager, not
  # contents of the app, so nothing in here is shipped inside the bundle.
  buildResources: build

# No version in the name, deliberately. GitHub serves the newest release's
# assets from /releases/latest/download/<name>, which is only a usable URL if
# <name> is the same every time — and both the install script and the updater
# want to construct that URL rather than query an API to discover it.
artifactName: ${productName}-mac-${arch}.${ext}

# The renderer is bundled into out/, so out/ plus the manifest was the whole
# app until node-llama-cpp arrived. It is the one runtime dependency, and it
# has to ship: the inference process `require`s it at runtime rather than
# having it bundled, because bundling breaks the on-disk layout its native
# binaries are located through.
#
# The exclusions below matter more than they look. node-llama-cpp ships
# prebuilt binaries for every platform it supports — Linux, Windows, CUDA,
# Vulkan — and without filtering them out they all ride along, several hundred
# megabytes of them, in a Mac-arm64-only app.
files:
  - out/**
  - package.json
  - node_modules/node-llama-cpp/**
  - "!node_modules/node-llama-cpp/{docs,test,.github,templates}/**"
  - node_modules/@node-llama-cpp/mac-arm64-metal/**
  - node_modules/ipull/**
  - node_modules/lifecycle-utils/**

# The native pieces cannot live inside app.asar: dlopen needs a real path on
# disk, not a path into an archive. Copied from the official node-llama-cpp
# Electron template.
asarUnpack:
  - node_modules/node-llama-cpp/bins/**
  - node_modules/@node-llama-cpp/**

# Re-sign after unpacking, and the ordering is the whole point.
#
# electron-builder signs the bundle before asarUnpack's payload is in its final
# place, so the unpacked .node files and dylibs end up with no valid signature
# of their own. On arm64 macOS that is fatal — the loader kills the app as
# damaged (electron-builder#5850).
#
# It is doubly load-bearing here because `identity` is ad-hoc and selfupdate.ts
# runs `codesign --verify --deep --strict` against every downloaded bundle
# before swapping it in. Skip this and the app still launches from a fresh
# install while every future self-update silently refuses.
afterPack: build/resign.cjs

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Ad-hoc. There is no Apple Developer certificate behind this project and
  # there is not going to be one; an unsigned arm64 binary is killed on exec, so
  # "-" is the floor, not a preference. Hardened runtime buys nothing without
  # notarization and electron-builder mis-signs when it is combined with an
  # ad-hoc identity.
  identity: "-"
  hardenedRuntime: false
  # zip is what the install script and the updater consume — it is the format
  # ditto round-trips with signatures, symlinks and execute bits intact. dmg is
  # for anyone who would rather click, and costs one Gatekeeper argument (see
  # the README) that the zip path never has.
  #
  # arm64 only. Adding x64 back is one line here if an Intel Mac ever turns up.
  target:
    - target: zip
      arch: [arm64]
    - target: dmg
      arch: [arm64]

# Compiled into the binary at package time, and irreversible from outside it.
# The first two close the "run this app as a plain Node process" hole; the
# third stops a debugger being attached to the main process by anyone who can
# set an environment variable.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
