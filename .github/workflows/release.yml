name: Build and release

# Every push to main is built so packaging breakage shows up on the commit that
# caused it, but only a tag is published. See RELEASING.md — the split matters,
# because a published release is what the in-app updater offers to everyone
# already running Casebook.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Read-only, and runs on every push. Nothing in here can write to the
  # repository, which is the point: the twelve minutes of npm install, build and
  # packaging — the part that executes the most third-party code — has no token
  # worth stealing. Publishing is a separate job below, gated on a tag.
  build:
    name: Build and verify
    # macOS, and not negotiable: codesign exists nowhere else, and an unsigned
    # arm64 bundle is killed the moment it is executed.
    runs-on: macos-latest
    steps:
      # Actions are pinned by commit rather than by tag. A tag is a moving
      # pointer the action's owner can repoint at any time, so `@v7` is a
      # standing invitation to run code nobody here has looked at — on a runner
      # that packages the app people install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes. Leaving the token in .git/config would leave
          # it readable by every script npm runs for the rest of the job.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26" # as mise.toml pins it
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(node -p "require('./package.json').version")
          if [ "$tag" != "$packaged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $packaged."
            echo "The app would report $packaged while the release claimed $tag, and the"
            echo "updater would offer the same update forever. See RELEASING.md."
            exit 1
          fi
          echo "Releasing $packaged."

      # Before the twelve-minute build rather than after it, so a missing
      # section fails in seconds — the notes are the one part of a release that
      # cannot be corrected for whoever already read them.
      - name: Changelog must describe this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # `--publish never` is inside the script, and load-bearing: electron-builder
      # sniffs for CI and starts publishing on its own otherwise, which fails for
      # want of a token it should never have been given. Releases are cut by the
      # explicit publish job below, where the conditions are visible.
      - run: npm run dist

      # The three properties the whole distribution story rests on, none of
      # which announce themselves when they break. Ad-hoc signing is what makes
      # the app runnable on Apple silicon at all; the fuses are compiled in at
      # package time and are unrecoverable afterwards.
      - name: Verify signature and fuses
        run: |
          app="dist/mac-arm64/Casebook.app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q "Signature=adhoc" \
            || { echo "::error::$app is not ad-hoc signed."; exit 1; }
          codesign --verify --deep --strict "$app" \
            || { echo "::error::$app failed signature verification."; exit 1; }
          # The locally installed copy, from devDependencies. A bare `npx
          # @electron/fuses` fetched whatever the registry served at that moment
          # and ran it against the bundle about to be released.
          fuses=$(./node_modules/.bin/electron-fuses read --app "$app")
          echo "$fuses"
          for fuse in RunAsNode EnableNodeOptionsEnvironmentVariable EnableNodeCliInspectArguments; do
            echo "$fuses" | grep -q "$fuse is Disabled" \
              || { echo "::error::Fuse $fuse is not disabled."; exit 1; }
          done

      # Kept whether or not this is a release. On an untagged build it is a
      # downloadable for testing, invisible to the updater, gone in a fortnight;
      # on a tag it is what the publish job attaches, so the bytes that were
      # verified above are the bytes that ship.
      - name: Keep the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: casebook-mac-arm64-${{ github.sha }}
          path: |
            dist/Casebook-mac-arm64.zip
            dist/Casebook-mac-arm64.dmg
          retention-days: 14

  # The only job that can write to the repository, and it exists only on a tag.
  # It does no npm install and runs no build tooling — it downloads what `build`
  # already verified and attaches it to a release.
  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v8 fails the run on a download digest mismatch rather than warning, which
      # is the property that makes "the bytes that were verified are the bytes
      # that ship" a claim rather than a hope.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: casebook-mac-arm64-${{ github.sha }}
          path: dist

      # Regenerated rather than carried across from the build job: it is a pure
      # function of CHANGELOG.md at this commit, and the build already proved
      # the section exists.
      - name: Release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      # A real release, which is the only thing /releases/latest/download
      # resolves to and so the only thing the install script and the updater
      # can see.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Casebook ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/Casebook-mac-arm64.zip \
            dist/Casebook-mac-arm64.dmg
