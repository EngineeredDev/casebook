name: Build and release

# Nothing is built here at the moment.
#
# The jobs that compiled the Bun executables, pushed the demo image and
# force-moved the `latest` prerelease all described a product that no longer
# exists in this tree: there is no server.ts to compile and no Bun to compile it
# with. They come back — as one electron-builder job producing a signed .app —
# when the Electron packaging work lands. Until then the `latest` release
# already published on GitHub stays exactly as it is, which is what people who
# have Casebook installed are running.
#
# Keeping the trigger and the check job means main is still verified on every
# push, and the diff that restores releasing is confined to this file.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: latest # as mise.toml pins it
          cache: npm
      - run: npm ci
      - run: npm run check
