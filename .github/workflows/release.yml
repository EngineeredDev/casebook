name: Build and release

# Every push to main rebuilds all three artifacts and force-moves the `latest`
# prerelease onto that commit, so a download link handed to someone never goes
# stale. Pushing a v* tag runs the same build and cuts a permanent, numbered
# release instead.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer push supersedes an in-flight one: two runs racing to delete and
# recreate the `latest` release could otherwise leave it holding binaries from
# different commits. Keyed on the ref, so a tag build is only ever cancelled by
# a re-push of that same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # as mise.toml pins it; the app needs Bun >= 1.3
      - run: bun install --frozen-lockfile
      - run: bun run check

  macos:
    name: macOS binaries
    needs: check
    # An arm64 runner that builds the Intel binary too: `codesign --sign -` seals
    # any Mach-O whatever its architecture, and codesign exists only on macOS.
    # Skipping it leaves Gatekeeper calling a downloaded copy "damaged", with no
    # override button — see scripts/sign-mac.sh.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Compile and sign
        run: |
          bun run build:mac-arm
          bun run build:mac-intel
      - name: Package
        # Zipped here rather than left to upload-artifact, whose own archiving
        # drops the execute bit — the recipient would get a file macOS refuses to
        # run. A zip round-trip keeps both the bit and the signature.
        run: |
          mkdir -p artifacts
          (cd dist/mac-arm   && zip -qX "$GITHUB_WORKSPACE/artifacts/Casebook-mac-arm.zip"   Casebook)
          (cd dist/mac-intel && zip -qX "$GITHUB_WORKSPACE/artifacts/Casebook-mac-intel.zip" Casebook)
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/*.zip
          if-no-files-found: error
          compression-level: 0 # already-compressed zips

  windows:
    name: Windows binary
    needs: check
    # Cross-compiled from Linux: `bun build --compile` emits the .exe on any host
    # and there is no Windows signing step that would need a native runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:windows
      - name: Package
        run: |
          mkdir -p artifacts
          (cd dist/windows && zip -qX "$GITHUB_WORKSPACE/artifacts/Casebook-windows-x64.zip" Casebook.exe)
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/*.zip
          if-no-files-found: error
          compression-level: 0

  docker:
    name: Demo image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR push
    steps:
      - uses: actions/checkout@v7
      # arm64 is emulated. Only `bun install` runs at build time and it is more
      # I/O than CPU, so the penalty is small — and without it an Apple-silicon
      # Mac has to run the image under Rosetta, where Bun starts but never
      # binds its port.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # The action lowercases this; GHCR rejects the mixed-case owner name.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    needs: [macos, windows, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases and move the `latest` tag
    steps:
      # No checkout: the release is assembled entirely from the built artifacts
      # and the gh API.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh artifacts

          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')

          printf 'Built from `%s`.\n\n' "$GITHUB_SHA" > notes.md
          cat >> notes.md <<'EOF'
          | Platform | Download |
          | --- | --- |
          | macOS (Apple silicon) | `Casebook-mac-arm.zip` |
          | macOS (Intel) | `Casebook-mac-intel.zip` |
          | Windows (x64) | `Casebook-windows-x64.zip` |

          Unzip and double-click `Casebook`. Your browser opens the app, and your
          data is the `data.json` written beside it.

          Neither binary is notarized or certificate-signed, so the first launch
          takes one extra step:

          - **macOS** — right-click → Open, or `xattr -d com.apple.quarantine Casebook`.
          - **Windows** — SmartScreen warns; "More info" → "Run anyway".

          Hosted-demo image (not the product — see the README):

          EOF
          printf '```\ndocker run --rm -e PORT=8080 -p 8080:8080 %s:latest\n```\n' "$image" >> notes.md

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              --generate-notes \
              artifacts/*.zip
          else
            # Force-move `latest` onto this commit. It has to be deleted first —
            # gh will not repoint the tag of an existing release. The second
            # delete covers a tag left behind without a release.
            gh release delete latest --cleanup-tag --yes 2>/dev/null || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" 2>/dev/null || true
            gh release create latest \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Latest build ($(printf '%.7s' "$GITHUB_SHA"))" \
              --notes-file notes.md \
              artifacts/*.zip
          fi
